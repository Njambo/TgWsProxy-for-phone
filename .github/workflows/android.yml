name: Android CI

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'tools/**'
      - 'docs/**'
      - '.github/workflows/android.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Protocol self-check
        run: |
          python3 -m pip install --quiet cryptography
          python3 tools/verify_crypto.py

      - name: Version code
        run: echo "VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 не задан: APK подписан временным debug-ключом, обновление поверх установленного приложения не встанет"
          fi

      - name: Build release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease -PciBuild=${{ env.VERSION_CODE }} --no-daemon --stacktrace

      - name: Version name
        run: |
          name=$(jq -r '.elements[0].versionName // empty' android/app/build/outputs/apk/release/output-metadata.json 2>/dev/null || true)
          echo "VERSION_NAME=${name:-$VERSION_CODE}" >> "$GITHUB_ENV"

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "tgws-mobile-${{ env.VERSION_CODE }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: tgws-mobile-release
          path: tgws-mobile-${{ env.VERSION_CODE }}.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.VERSION_CODE }}
          name: Версия ${{ env.VERSION_NAME }}
          body: ${{ github.event.head_commit.message }}
          files: tgws-mobile-${{ env.VERSION_CODE }}.apk
          make_latest: true
